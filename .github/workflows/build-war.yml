name: Build Nostar Bank WAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build WAR
        run: mvn -B clean package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nostar-bank-war
          path: target/nostar-bank.war
